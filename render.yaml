services:
  - type: web
    name: dual-engine-llm-optimizer
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: REDIS_URL
        sync: false
      - key: CACHE_TTL_SECONDS
        value: "3600"
      - key: PROVIDER_TIMEOUT_SECONDS
        value: "45"
